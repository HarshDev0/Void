<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID | Contact</title>

<link rel="icon" href="Favicon/icons8-contact-48.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* -------- GLOBAL -------- */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Helvetica Neue', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
}

/* -------- HEADER -------- */
header{
    background:#000;
    padding:1rem 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-family:'Poppins', sans-serif;
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:4px;
    color:#fff;
    text-decoration:none;
}

nav{
    display:flex;
    gap:2rem;
    align-items:center;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:1px;
    position:relative;
    padding-bottom:4px;
}

nav a::after{
    content:'';
    position:absolute;
    width:0;
    height:1px;
    left:0;
    bottom:0;
    background:#fff;
    transition:0.3s ease;
}

nav a:hover::after,
nav a.active::after{
    width:100%;
}

.cart-icon img{
    width:20px;
}

/* -------- HAMBURGER -------- */
.hamburger{
    display:none;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}

.hamburger span{
    width:25px;
    height:2px;
    background:#fff;
    transition:0.3s ease;
}

.hamburger.active span:nth-child(1){
    transform:rotate(45deg) translate(5px,5px);
}
.hamburger.active span:nth-child(2){
    opacity:0;
}
.hamburger.active span:nth-child(3){
    transform:rotate(-45deg) translate(5px,-5px);
}

/* -------- SECTIONS -------- */
.contact-section{
    min-height:60vh;
    padding:5rem 10%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;

    opacity:0;
    transform:translateY(120px);
    transition:opacity 1s ease, transform 1s cubic-bezier(.17,.67,.35,1);
}

.contact-section.active{
    opacity:1;
    transform:translateY(0);
}

.white{
    background:#ffffff;
    color:#000;
}

.grey{
    background:#8c8c8c;
    color:#fff;
}

/* -------- COMPACT CONTACT -------- */
.contact-compact{
    width:100%;
    max-width:700px;
}

.contact-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Poppins', sans-serif;
    font-size:1.2rem;
    margin:1.5rem 0;
}

.contact-row .label{
    font-weight:600;
}

.contact-row .value{
    opacity:0.85;
    text-align:right;
    word-break:break-all;
}

.contact-compact hr{
    border:none;
    height:1px;
    background:#000;
    width:100%;
    margin:1rem 0;
}

/* -------- SOCIAL LINKS (UNCHANGED) -------- */
.social-links{
    display:flex;
    flex-direction:column;
    gap:1.5rem;
    margin-top:2rem;
}

.social-links a{
    display:inline-flex;
    align-items:center;
    gap:12px;
    color:inherit;
    text-decoration:none;
    font-family:'Poppins', sans-serif;
    position:relative;
    font-size:1.1rem;
}

.social-links a::after{
    content:'';
    position:absolute;
    width:0;
    height:1px;
    left:0;
    bottom:-4px;
    background:currentColor;
    transition:0.3s ease;
}

.social-links a:hover::after{
    width:100%;
}

.social-links i{
    font-size:1.2rem;
}

/* -------- FOOTER -------- */
footer{
    background:#000;
    color:#fff;
    text-align:center;
    padding:3rem 1rem;
    border-top:1px solid #333;
}

footer p{
    font-size:0.8rem;
    opacity:0.6;
    letter-spacing:1px;
}

/* -------- RESPONSIVE -------- */
@media(max-width:768px){

    nav{
        position:absolute;
        top:100%;
        left:0;
        width:100%;
        background:#000;
        flex-direction:column;
        align-items:center;
        gap:2rem;
        padding:2rem 0;
        transform:translateY(-120%);
        transition:0.4s ease;
    }

    nav.active{
        transform:translateY(0);
    }

    .hamburger{
        display:flex;
    }

    .contact-section{
        padding:4rem 6%;
    }

    .contact-row{
        flex-direction:column;
        gap:0.5rem;
        text-align:center;
    }

    .contact-row .value{
        text-align:center;
    }

}

</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">VOID</a>

    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html" class="cart-icon">
            <img src="images/icons8-shopping-cart-30.png" alt="Cart">
        </a>
    </nav>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<!-- WHITE SECTION -->
<section class="contact-section white">
    <div class="contact-compact">

        <div class="contact-row">
            <span class="label">Email</span>
            <span class="value">harshvish1408@gmail.com</span>
        </div>

        <hr>

        <div class="contact-row">
            <span class="label">Phone</span>
            <span class="value">+91 1234567890</span>
        </div>

    </div>
</section>

<!-- GREY SECTION -->
<section class="contact-section grey">
    <div class="contact-content">
        <h3 style="font-family:'Poppins', sans-serif;">Connect With Us</h3>

        <div class="social-links">
            <a href="https://www.instagram.com/ft.hxrsh_/">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <a href="https://x.com/HarshDevXD">
                <i class="fa-brands fa-x-twitter"></i> X
            </a>

            <a href="#">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
        </div>

    </div>
</section>

<footer>
    <p>&copy; 2026 VOID APPAREL. EMBRACE THE MINIMAL.</p>
</footer>

<script>

/* Scroll Animation */
const sections = document.querySelectorAll('.contact-section');
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add('active');
        } else {
            entry.target.classList.remove('active');
        }
    });
},{threshold:0.25});
sections.forEach(section=>observer.observe(section));

/* Hamburger */
const hamburger = document.getElementById("hamburger");
const navMenu = document.getElementById("navMenu");

hamburger.addEventListener("click",()=>{
    hamburger.classList.toggle("active");
    navMenu.classList.toggle("active");
});

document.querySelectorAll("#navMenu a").forEach(link=>{
    link.addEventListener("click",()=>{
        hamburger.classList.remove("active");
        navMenu.classList.remove("active");
    });
});

</script>

</body>
</html>
